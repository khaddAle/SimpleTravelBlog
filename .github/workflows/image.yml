name: image

# Build the runtime image and smoke-test its native layer BEFORE a tag is cut.
#
# `release.yml` only runs on a `v*` tag, so until now the first time anything
# built docker/Dockerfile was after the version had been decided. That leaves the
# in-container `npm rebuild sharp argon2`, the `npm prune --omit=dev` and the
# runtime stage unverified on every PR — precisely the parts a Node major bump or
# a native-dependency bump breaks. This job closes that gap on the PR instead.
#
# Nothing is pushed here; `release.yml` remains the only publisher.
on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - '.github/workflows/image.yml'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - '.github/workflows/image.yml'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: image/build-and-smoke
    # Native arm64 — the image is linux/arm64 only, so this builds without QEMU
    # and exercises the same architecture the cluster runs.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (load into the local daemon; never pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: simple-travel-blog:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the native layer (sharp + libvips/HEIF, argon2)
        # Mounted read-only into /app so bare specifiers resolve against the
        # pruned production node_modules the image actually ships.
        run: |
          docker run --rm \
            -v "$PWD/docker/smoke.mjs:/app/smoke.mjs:ro" \
            -w /app \
            simple-travel-blog:smoke \
            node smoke.mjs

      - name: Report image size
        run: docker image ls simple-travel-blog:smoke --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
