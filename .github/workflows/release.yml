name: release

# On a semver tag (v1.2.3) build the single linux/arm64 application image and
# push it to GHCR. This is the whole job: no checkout of any other repo, no
# cross-repo token, no manifest edits elsewhere. The only deploy-facing output is
# a tagged image in a public registry; everything environment-specific lives in a
# separate private deploy repo that polls GHCR for new tags.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: release/image
    # Native arm64 runner — the image is linux/arm64 only, so it builds without
    # QEMU emulation (fast).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name, so a mixed-case owner is
          # fine here.
          images: ghcr.io/${{ github.repository_owner }}/simple-travel-blog
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep a plain single-arch manifest (no provenance/sbom attestations),
          # so the pushed reference is the image itself rather than an OCI index —
          # simpler for single-arch pulls into the cluster.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security: report-only Trivy scan + CycloneDX SBOM of the pushed image.
      # tags[0] is the first full (lowercased) image:tag the build pushed.
      - name: Scan image and generate SBOM
        uses: ./.github/actions/scan-image
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          sbom-name: sbom-simple-travel-blog-${{ steps.meta.outputs.version }}.cyclonedx.json
