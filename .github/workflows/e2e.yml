name: e2e

# E2E is slower (real browser + in-memory Mongo/Redis/storage + built SPA) and
# is deliberately kept off the per-PR `ci` gate. It runs nightly and on demand.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: e2e/playwright
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Rebuild native deps (sharp, argon2)
        # The harness transcodes images (sharp) and hashes the seed admin
        # password (argon2); --ignore-scripts skipped their native setup.
        run: npm rebuild sharp argon2 || true

      - name: Build shared + frontend (harness serves the built SPA)
        run: |
          npm run build -w @stb/shared
          npm run build -w @stb/frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
